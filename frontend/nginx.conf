# Not yet tested. See "Running with Docker" in the README.
#
# The browser talks only to this server: it serves the built single-page app and forwards /api to
# the backend container, so no CORS is needed between the two.

# At most 5 requests per second and client address on the login and registration routes
# (Argon2 makes every attempt expensive for the server).
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API accepts images up to 2 MB; this leaves room for the multipart envelope.
    client_max_body_size 3m;

    # Text files are sent compressed (roughly a third of the size for JavaScript and CSS).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The app loads nothing from other origins. Swagger UI (/api/docs) needs a CDN script and is
    # blocked by this policy, which is what you want on a public server.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    # Only the routes where a guess costs the server an Argon2 hash (not /api/auth/me, which the
    # app calls on every page load).
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The build gives every file in /assets/ a name that changes with its content, so browsers may
    # keep them for a year. (`expires` does not replace the security headers above; `add_header`
    # inside this block would.)
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Every other URL belongs to the single-page app (React Router decides what to show).
    location / {
        try_files $uri /index.html;
    }
}

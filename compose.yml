# Not yet tested with Docker. Read "Running with Docker" in the README before you rely on it, and
# please report what you had to change.
#
# Three services: the database, the API and the web server (built frontend plus a proxy for /api).
# Compared with running everything by hand, only the host in DATABASE_URL changes: "localhost"
# becomes the service name "db". The API logs in as the non-superuser role ecommerce, created by
# scripts/docker-db-init.sh.
#
# Settings come from a file named .env next to this one (copy .env.example). It is git-ignored.

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
      - ./scripts/docker-db-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://ecommerce:${APP_DB_PASSWORD}@db:5432/ecommerce
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      UPLOAD_DIR: /app/uploads
      # Read by seed.py (see the README): docker compose exec backend python seed.py
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  uploads:
